<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post</title>
<style>
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f5f4f0; color: #1f2430; }
.boks { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1.2rem 3rem; }
.nr { display: inline-block; background: #2f4f7f; color: #fff; font-weight: 800; font-size: 1.1rem; padding: .3rem .9rem; border-radius: 99px; }
h1 { font-size: 1.6rem; line-height: 1.3; margin: 1rem 0; }
.alt { list-style: none; padding: 0; margin: 1rem 0; }
.alt li { background: #fff; border: 2px solid #dde2ea; border-radius: 10px; padding: .8rem 1rem; margin: .5rem 0; font-size: 1.25rem; }
.alt b { display: inline-block; width: 2rem; color: #2f4f7f; }
.gjor { background: #e8eef7; border-radius: 10px; padding: .8rem 1rem; font-size: 1.1rem; }
.fot { color: #6b7280; font-size: .85rem; margin-top: 2rem; }
</style>
</head>
<body>
<div class="boks" id="post"><p>Skann QR-koden på posten.</p></div>
<script>
(function () {
  var p = new URLSearchParams(location.hash.slice(1));
  if (!p.get('t')) return;
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  var alt = (p.get('a') || '').split('|').filter(Boolean);
  document.title = 'Post ' + (p.get('n') || '');
  document.getElementById('post').innerHTML = '<span class="nr">Post ' + esc(p.get('n') || '') + '</span>' +
    '<h1>' + esc(p.get('t')) + '</h1>' +
    (alt.length ? '<ul class="alt">' + alt.map(function (a) { var i = a.indexOf(':'); return '<li><b>' + esc(a.slice(0, i)) + '</b>' + esc(a.slice(i + 1)) + '</li>'; }).join('') + '</ul>' : '') +
    (p.get('g') ? '<p class="gjor">' + esc(p.get('g')) + '</p>' : '') +
    '<p class="fot">Skriv svaret på svararket ditt.</p>';
})();
</script>
</body>
</html>
