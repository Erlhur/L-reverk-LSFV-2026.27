<!DOCTYPE html>

<title>Bla i boka — Samfunnsfag</title>
<style>
:root { --kap: #123252; --mork: #1f2430; --svak: #5a6272; --kant: #d6d9de; --bak: #e9ebee; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bak); color: var(--mork);
  font-family: "Source Sans 3", "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--kant);
  display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; padding: .55rem 1rem; }
header a.tilbake { color: var(--kap); font-weight: 700; text-decoration: none; white-space: nowrap; }
header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kontroller { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
button, select, input { font: inherit; font-size: .95rem; }
button { background: #fff; border: 1px solid var(--kant); border-radius: 8px; padding: .35rem .7rem; cursor: pointer; }
button:hover { border-color: var(--kap); }
button.hoved { background: var(--kap); color: #fff; border-color: var(--kap); font-weight: 700; }
button:disabled { opacity: .4; cursor: default; }
select { border: 1px solid var(--kant); border-radius: 8px; padding: .35rem .4rem; max-width: 16rem; background: #fff; }
input[type=number] { width: 4.2rem; border: 1px solid var(--kant); border-radius: 8px; padding: .3rem .4rem; text-align: center; }
.sidetekst { color: var(--svak); font-size: .9rem; white-space: nowrap; }
a.nettside { font-size: .9rem; color: var(--kap); white-space: nowrap; }
main { display: flex; justify-content: center; align-items: flex-start; gap: 4px; padding: 1.2rem .6rem 3rem; min-height: 70vh; touch-action: pan-y; }
canvas { background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.18); max-width: 100%; height: auto; display: block; }
.tom { visibility: hidden; }
.laster { color: var(--svak); padding: 3rem; text-align: center; }
.hjelp { text-align: center; color: var(--svak); font-size: .85rem; padding-bottom: 1.5rem; }
@media (max-width: 700px) { header h1 { display: none; } select { max-width: 11rem; } }
</style>

    <a id="nettside" class="nettside" href="index.html">Åpne nettsiden</a>

</header>

const flate = document.getElementById('flate');
const felt = document.getElementById('sidefelt');
const sel = document.getElementById('innhold');
const nett = document.getElementById('nettside');
let pdf, n, pdfside = 1;
const tall = DATA.sidetall;                         // trykt sidetall for hver pdf-side (null = omslag)
const pdfFra = s => { const i = tall.indexOf(s); return i >= 0 ? i + 1 : null; };
const oppslag = () => window.innerWidth >= 1100;    // to sider ved siden av hverandre på store skjermer

// innholdsfortegnelsen
for (const o of DATA.innhold) {
  const op = document.createElement('option');
  op.value = o.pdf;
  op.textContent = (o.niva === 1 ? `Kapittel ${o.kap}: ${DATA.kapitler[o.kap] || o.tittel}` : ' ' + o.tittel) + (o.side ? ` · s. ${o.side}` : '');
  sel.appendChild(op);
}
sel.addEventListener('change', () => { if (sel.value) gå(+sel.value); sel.value = ''; });

function kapittelFor(p) {
  let k = null;
  for (const o of DATA.innhold) if (o.niva === 1 && o.pdf <= p) k = o.kap;
  return k;
}

function synlige(p) {
  if (!oppslag()) return [p];
  // oppslag som i en bok: venstreside (partall) + høyreside (oddetall); side 1 (omslag) står alene
  if (p === 1 || p === n) return [p];
  const v = p % 2 === 0 ? p : p - 1;
  return [v, v + 1 <= n ? v + 1 : null];
}

let jobb = 0;
async function tegn() {
  const min = ++jobb;
  const vis = synlige(pdfside);
  const bredde = Math.min(window.innerWidth - 24, 1500);
  const perSide = vis.length === 2 ? (bredde - 8) / 2 : Math.min(bredde, 860);
  const lerreter = [];
  for (const p of vis) {
    const c = document.createElement('canvas');
    if (!p) { c.className = 'tom'; lerreter.push(c); continue; }
    const side = await pdf.getPage(p);
    if (min !== jobb) return;
    const v0 = side.getViewport({ scale: 1 });
    const skala = perSide / v0.width;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const v = side.getViewport({ scale: skala * dpr });
    c.width = v.width; c.height = v.height;
    c.style.width = (v.width / dpr) + 'px';
    c.setAttribute('role', 'img');
    c.setAttribute('aria-label', tall[p - 1] ? `Side ${tall[p - 1]}` : 'Omslag');
    await side.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;
    if (min !== jobb) return;
    lerreter.push(c);
  }
  if (vis.length === 2 && lerreter.length === 2 && lerreter[0].className === 'tom') lerreter[0].style.width = lerreter[1].style.width;
  flate.replaceChildren(...lerreter);
  const s = tall[pdfside - 1];
  felt.value = s || '';
  history.replaceState(null, '', s ? '#s' + s : '#omslag');
  const k = kapittelFor(pdfside);
  nett.href = k ? `kapittel-${k}.html` + (s ? `#s${s}` : '') : 'index.html';
  nett.textContent = k ? `Åpne kapittel ${k} på nettsiden` : 'Åpne nettsiden';
  document.getElementById('forrige').disabled = pdfside <= 1;
  document.getElementById('neste').disabled = vis[vis.length - 1] >= n || pdfside >= n;
}

function gå(p) {
  pdfside = Math.max(1, Math.min(n, p));
  tegn();
  window.scrollTo(0, 0);
}
function steg(retning) {
  const vis = synlige(pdfside);
  gå(retning > 0 ? (vis[vis.length - 1] || vis[0]) + 1 : vis[0] - 1);
}
document.getElementById('forrige').onclick = () => steg(-1);
document.getElementById('neste').onclick = () => steg(1);
felt.addEventListener('change', () => { const p = pdfFra(+felt.value); if (p) gå(p); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') steg(1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') steg(-1);
});
let x0 = null;
flate.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
flate.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 60) steg(dx < 0 ? 1 : -1);
});
let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(tegn, 200); });
window.addEventListener('hashchange', () => { const m = location.hash.match(/^#s(\d+)$/); if (m) { const p = pdfFra(+m[1]); if (p && p !== pdfside) gå(p); } });

try {
  pdf = await pdfjs.getDocument({ url: 'bok.pdf', disableAutoFetch: true }).promise;
  n = pdf.numPages;
  document.getElementById('avtotal').textContent = 'av ' + Math.max(...tall.filter(Boolean));
  const m = location.hash.match(/^#s(\d+)$/);
  gå(m ? (pdfFra(+m[1]) || 1) : 1);
} catch (e) {
  flate.innerHTML = '<div class="laster">Boka kunne ikke åpnes. Prøv å laste siden på nytt.</div>';
  console.error(e);
}
